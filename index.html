<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarthLife Co.</title>
    <meta name="description" content="Natural everyday essentials crafted from Neem wood, bamboo, and coconut coir." />
    <meta property="og:title" content="EarthLife Co." />
    <meta property="og:description" content="Natural everyday essentials crafted from Neem wood, bamboo, and coconut coir." />
    <!-- Suppress benign ResizeObserver notifications -->
    <script>
      (function() {
        const isBenignThirdPartyError = (msg) => {
          if (!msg) return false;
          const str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          return (
            str.includes('ResizeObserver loop completed with undelivered notifications') ||
            str.includes('ResizeObserver loop limit exceeded')
          );
        };

        window.addEventListener('error', function(event) {
          if (event && (isBenignThirdPartyError(event.message) || isBenignThirdPartyError(event.error?.message))) {
            event.stopImmediatePropagation();
            event.stopPropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && (isBenignThirdPartyError(event.reason?.message) || isBenignThirdPartyError(event.reason))) {
            event.stopImmediatePropagation();
            event.stopPropagation();
            event.preventDefault();
          }
        }, true);

        // Ensure EarthLife Co. official support email is always displayed across Ecwid storefront widgets
        const OLD_EMAIL_REGEX = /ceo@earthlifeco\.(?:com|co)/gi;
        const TARGET_EMAIL = 'support@earthlifeco.com';

        function replaceEmailInNode(node) {
          if (!node) return;
          if (node.nodeType === Node.TEXT_NODE) {
            if (OLD_EMAIL_REGEX.test(node.nodeValue)) {
              node.nodeValue = node.nodeValue.replace(OLD_EMAIL_REGEX, TARGET_EMAIL);
            }
            return;
          }
          if (node.nodeType === Node.ELEMENT_NODE) {
            if (node.tagName === 'A' && node.href && OLD_EMAIL_REGEX.test(node.href)) {
              node.href = node.href.replace(OLD_EMAIL_REGEX, TARGET_EMAIL);
            }
            for (let child = node.firstChild; child; child = child.nextSibling) {
              replaceEmailInNode(child);
            }
          }
        }

        const emailObserver = new MutationObserver(function(mutations) {
          for (let i = 0; i < mutations.length; i++) {
            const mut = mutations[i];
            if (mut.type === 'childList') {
              for (let j = 0; j < mut.addedNodes.length; j++) {
                replaceEmailInNode(mut.addedNodes[j]);
              }
            } else if (mut.type === 'characterData') {
              if (OLD_EMAIL_REGEX.test(mut.target.nodeValue)) {
                mut.target.nodeValue = mut.target.nodeValue.replace(OLD_EMAIL_REGEX, TARGET_EMAIL);
              }
            }
          }
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            replaceEmailInNode(document.body);
            emailObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
          });
        } else {
          replaceEmailInNode(document.body);
          emailObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
        }
      })();
    </script>
    <!-- Google Fonts: Playfair Display for editorial heading, Outfit for brand headings, Inter for body text, Caveat for organic accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
